<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>single blog</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../styles/singleblog.css" />
  </head>
  <body>
<div class="singlePage">
  <div class="loaderOverlay">
    <div class="loader"></div>
  </div>
  <div class="singlecontainer">
    <div class="blogdetails1" id="blogdetails1"></div>
    <div class="additions">
    </div>
    <div class="commentsection">
      <h1 id="commentsNumber"></h1>
      <div class="commentcreation">
        <div class="commentingperson">
          <i class="fa-solid fa-user"></i>
        </div>

        <div class="createcomment">
          <form action="">
            <input type="text" placeholder="Add a comment..."  id="message" name="commentMessage"/>
           
              <div class="decisions">
                <button type="button" style="border:none ; background-color: white;" id="cancelBtn" >Cancel</button>
                <button type="button" style="border:none ; background-color: white;" id="commentBtn" >Comment</button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="createdcomment">
        <div class="dynamicContent" id="dynamicContent">

        </div>
      </div>
    </div>
    <div class="commentRestblogs" style="display: flex;">     
      <div class="otheravailableblogs" id="otheravailableblogs">
        <h2>Other available blogs</h2>
      </div>
     </div>   
  
  </div>

</div>
  <script src="../scripts/singleblog.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  </body>
</html>
